# The stack a GitHub Codespace launched from this repository runs: the PUBLISHED images and nothing else. No tap
# checkout is mounted. `web` is the playground's product image, tap-web with this repository's `codespace` record and
# every plugin it installs already built in (publish-image.yml), so a start installs nothing. Why each non-obvious line is here is
# in specs/spec-rampart_20x_playground-codespaces.md (req-rampart-20x-playground-codespaces-*).
name: rampart-20x-playground
services:
  db:
    # tap v0.4.8, pinned by digest only (a tag@digest reference fails to parse in Codespaces, and a
    # bare tag is mutable). It moves with the tap release `web` is built on.
    image: ghcr.io/unified-systems-com/tap-db@sha256:05104ed673d061e4e167d86e201275194f4b5934bf90eeeb7a5f8373029fd427
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - max_locks_per_transaction=512
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tap
      POSTGRES_USER: tap
      # A bootstrap value, the same in every Codespace and in a prebuild: on the Codespace's first start
      # tap's initializer re-keys the role to a password minted into the installation volume.
      POSTGRES_PASSWORD: bootstrap-replaced-at-first-start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tap -d tap"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    # The product image publish-image.yml built from main at 307acea on tap v0.4.8, by digest (see the db service
    # above). A change to the codespace record publishes a new image; move this digest to it in the next change
    # (`docker buildx imagetools inspect ghcr.io/unified-systems-com/rampart-20x-playground-web:sha-<commit>`).
    image: ghcr.io/unified-systems-com/rampart-20x-playground-web@sha256:b96318200054a25002ac36986e55e8fb0bd83268d883b0cce4d9be17795073a0
    ports:
      - "8000:8000"
    volumes:
      # The file the image's entrypoint writes the derived origin and owner to; a non-root container cannot create it
      # in the root-owned /run, so initializeCommand creates it world-writable on the Codespace host, gitignored.
      - ./tap-codespace.env:/run/tap-codespace.env
      # This Codespace's identity, minted by tap's initializer at its first start: the secret key, the database
      # passwords and the grid id. A prebuild never gets that far (the entrypoint waits for a Codespace name first).
      - installation:/var/lib/tap/installation
      # The Codespace's name, forwarding domain and user, written by postStartCommand on every start
      # (codespace-identity.sh) and read by the entrypoint at TAP_CODESPACE_IDENTITY. initializeCommand creates it
      # empty; gitignored.
      - ./codespace-identity.env:/run/tap-codespace-identity.env
      # What a visitor's editor opens on (a page that says where the site is) and the script its terminal runs to print
      # the site's address; both read-only. The editor does not open on /app, which is tap's own code in the image.
      - ./welcome:/welcome:ro
      - ./site-ready.sh:/opt/playground/site-ready.sh:ro
      - ./codespace-identity.sh:/opt/playground/codespace-identity.sh:ro
    tmpfs:
      - /run/tap-gunicorn:size=4m,mode=1777
      # Where the boot record is written; /app is root-owned in the published image. World-writable rather than owned
      # by uid, which rootless Podman refuses.
      - /app/logs:size=64m,mode=1777
    environment:
      DATABASE_URL: postgres://tap:bootstrap-replaced-at-first-start@db:5432/tap
      TAP_INSTALLATION_DIR: /var/lib/tap/installation
      TAP_SERVE_PROFILE: development
      DEBUG: "false"
      # A fresh database has nothing to snapshot, and /app is not writable for the snapshot directory.
      TAP_BOOT_INSTALL__SNAPSHOT_BEFORE_MIGRATE: "false"
      # A new Codespace always starts on an empty database, so its tables are built from the models and every
      # migration is recorded as applied, in place of replaying each one (tap 0.4.2, req-boot-schema-from-models).
      # A database that already has a schema (a restarted Codespace) is migrated normally by the same command.
      TAP_BOOT_INSTALL__SCHEMA_FROM_MODELS: "true"
      # The entrypoint derives the forwarded origin, the trusted-proxy header and the owner from these; the secret key
      # is the initializer's.
      CODESPACES: "${CODESPACES:-}"
      CODESPACE_NAME: "${CODESPACE_NAME:-}"
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: "${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}"
      GITHUB_USER: "${GITHUB_USER:-}"
      GITHUB_API_URL: "${GITHUB_API_URL:-}"
      # A prebuilt Codespace's `web` was created with no name and is only restarted on resume, so the entrypoint
      # waits up to TAP_CODESPACE_NAME_WAIT (180 s) for postStartCommand to write the name here, and takes the three
      # values from this file over the environment above (tap v0.4.5, req-tap-serving-codespace-9).
      TAP_CODESPACE_IDENTITY: /run/tap-codespace-identity.env
      TAP_CODESPACE_BOOT_PROFILE: codespace
      TAP_BOOT_PROFILE: codespace
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  installation:
