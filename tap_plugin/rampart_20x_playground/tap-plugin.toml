manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.2.1"
slug = "rampart_20x_playground"
name = "TAP Rampart 20x Playground"
description = "A data-only instance plugin: the keystone, mocked GovCloud inventory and findings, and the pages that show a deployment design, an inventory, vulnerabilities and VDR reports."

# Vocabulary dependencies (new-plugin Tier 1b): the bundles reference other plugins' entity types by string.
# More arrive with the mock inventory (aws_core, computing_core, dcom) in the same change that seeds them.
depends_on = [
    { slug = "github_core", note = "The security-alerts bundle seeds github_core__code_scanning_alert, github_core__dependabot_alert and github_core__github_repository, plus the DETAILS_FINDING edge between an alert and its finding." },
    { slug = "compliance_core", note = "The security-alerts bundle seeds compliance_core__compliance_finding (one per alert) and the CARRIES_COMPLIANCE_FINDING edge that places each finding on its repository." },
]

# Pure configuration: no crypto, no native deps (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

[grift]
keystone = "grift/keystone.grift.json"
dimensions = "grift/dimensions.grift.json"
security_alerts = "grift/security-alerts.grift.json"

# In-package boot records (req-boot-bootstrap-records-in-package). Digests are the canonical sha256 of
# each record; refresh with the core tooling, never hand-edit.
[[boot.records]]
name = "demo"
description = "The stack shown on screen: the composed plugin set, each pinned by commit, plus this plugin's seed bundles."
sha256 = "ee1deb8f2a63535c697ca2276bf89776b3ef11b5b315e0570073e8a282dcf5c9"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in, offline and credential-free. The consumer flips self to editable."
sha256 = "0c344b2d036beeb115a05d5d7ed50b07b694ec39debfbf55c7ab85f51f8305e4"
