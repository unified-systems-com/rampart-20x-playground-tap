manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.2.1"
slug = "rampart_20x_playground"
name = "TAP Rampart 20x Playground"
description = "A data-only instance plugin: the keystone, mocked GovCloud inventory and findings, and the pages that show a deployment design, an inventory, vulnerabilities and VDR reports."

# Vocabulary dependencies (new-plugin Tier 1b): the bundles reference other plugins' entity types by string.
depends_on = [
    { slug = "github_core", note = "The security-alerts bundle seeds github_core__code_scanning_alert, github_core__dependabot_alert and github_core__github_repository, plus the DETAILS_FINDING edge between an alert and its finding." },
    { slug = "aws_core", note = "The mock inventory seeds aws_core nodes (account, VPC, subnet, load balancer, ECS cluster, service, task and container, RDS, secrets, keys, Lambda, buckets, and from v0.7.0 the CodePipeline pipeline and CodeBuild projects) and the official edges between them (ENROLLS_ACCOUNT, BELONGS_TO_ACCOUNT, PARTITIONED_INTO_SUBNET, ATTACHED_TO_VPC, RESIDES_IN_SUBNET, RUNS_SERVICE, RUNS_TASK, RUNS_CONTAINER, ENCRYPTED_WITH_KEY, RETRIEVES_SOURCE_FROM, RUNS_BUILD, WRITES_OBJECT, RETRIEVES_SECRET_FROM); the landing layout nests on them." },
    { slug = "computing_core", note = "The mock inventory seeds computing_core__host and computing_core__os_user for the computers of customers, the developer and the administrator, joined by DEFINES_OS_USER; the inventory entities bundle seeds computing_core__program, computing_core__file, computing_core__public_key and computing_core__private_key, with no edges. The application flow bundle seeds the aws_core__aws_ecs_container of each web task, one computing_core__application_flow (keyless, dataclass.customer=data, dataclass.action=transmit) and the RUNS_TASK, RUNS_CONTAINER, RUNS_IMAGE, RUNS_PROGRAM, APPLICATION_FLOW_SOURCE and APPLICATION_FLOW_DESTINATION edges. The inventory software bundle seeds computing_core__operating_system (Wolfi), a computing_core__host of kind container for the web image, computing_core__package (apk, pypi and npm), computing_core__library (the self-built OpenSSL FIPS provider and the source-built cryptography) and computing_core__crypto_provider (the crypto-BOM scan, scope tap-web), joined by RUNS_OPERATING_SYSTEM, INSTALLS_PACKAGE, LOADS_LIBRARY (from the TAP web program) and CARRIES_CRYPTO_PROVIDER." },
    { slug = "identity_core", min_version = "0.1.6", note = "The mock inventory seeds identity_core__human and the HELD_BY_HUMAN edge from a local account or GitHub account to the person who holds it. The teams bundle seeds four identity_core__team nodes, thirteen more identity_core__human nodes and the BELONGS_TO_TEAM__identity_core and LEADS_TEAM__identity_core edges, first shipped in v0.1.5, and four ANSWERS_FOR_DIMENSION__identity_core edges from each team to the team.responsible dimension node, first shipped in v0.1.6; the team.responsible stamp on entities in the other bundles is the entity id of one of those teams." },
    { slug = "dcom", note = "Every mock inventory entity carries the dcom dimension value design; the dimension nodes come from the dcom plugin." },
    { slug = "compliance_core", min_version = "0.8.10", note = "The Overview's Coverage panel is a compliance_core report panel (v0.8.10). The security-alerts bundle seeds compliance_core__compliance_finding (one per alert) and the CARRIES_COMPLIANCE_FINDING edge that places each finding on its repository; the mock inventory seeds one compliance_core__compliance_boundary (git-serious) and the SCOPED_TO_COMPLIANCE_BOUNDARY edge from the account to it. The Overview's task bubble uses the module Search runners findings-reached-count and findings-reached-list (compliance_core, searches/reach.py; Gryphon cannot sum two routes). The Data classification page uses the module Search runner dimension-coverage (compliance_core, searches/dimension_coverage.py; Gryphon cannot group a labelless aggregate by entity type and dimension value), which needs a compliance_core release after v0.8.4. The classification mapping and inventory coverage Searches use the module Search runners dimension-mapping-summary, dimension-mapping-entities and dimension-mapping-totals and search-snapshot-series (compliance_core, searches/dimension_mapping.py), with grouped mode and exclude_groups; the coverage_snapshot collector of fedramp_20x_vdr subclasses compliance_core's SearchSnapshotCollector. The totals and series runners and grouped mode ship by v0.8.9." },
    { slug = "fedramp_20x_vdr", min_version = "0.1.5", note = "The classification mapping bundle seeds a Schedule whose SCHEDULED_TARGET edge names the collector fedramp_20x_vdr:coverage_snapshot (entity id 41611294-9c37-5013-8175-3b1c2c4a3908); the schedule-grift-targets guard needs that collector registered. From v0.1.4 the collector records both summary Searches (classification mapping and responsibility coverage) as compliance_search_snapshot nodes." },
]

# Pure configuration: no crypto, no native deps (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

[grift]
keystone = "grift/keystone.grift.json"
dimensions = "grift/dimensions.grift.json"
security_alerts = "grift/security-alerts.grift.json"
actor_dimensions = "grift/dimensions-actors.grift.json"
mock_inventory = "grift/mock-inventory.grift.json"
inventory_entities = "grift/inventory-entities.grift.json"
inventory_software = "grift/inventory-software.grift.json"
application_flow = "grift/application-flow.grift.json"
vulnerability_enrichment = "grift/vulnerability-enrichment.grift.json"
vulnerabilities_page = "grift/vulnerabilities-page.grift.json"
pages = "grift/pages.grift.json"
inventory_coverage = "grift/inventory-coverage.grift.json"
inventory_page = "grift/inventory-page.grift.json"
classification_mapping = "grift/classification-mapping.grift.json"
data_classification_page = "grift/data-classification-page.grift.json"
coverage_seed = "grift/coverage-seed.grift.json"
# The Overview's Coverage report panel; after the inventory coverage and classification bundles whose Searches it reads.
coverage_panel = "grift/coverage-panel.grift.json"
teams = "grift/teams.grift.json"
# The Reporting page reads the coverage totals and history Searches, so it is seeded after the inventory coverage bundle.
reporting_page = "grift/reporting-page.grift.json"
# The pain bundle needs the stackarmor_vdr plugin (stamps, edges to its archetype nodes, runner keys), which is NOT in
# depends_on on purpose: the ci record installs the depends_on closure only, offline, and stackarmor_vdr is a private
# repository. The demo record installs it and seeds this bundle; the ci record seeds every bundle but this one.
pain = "grift/pain.grift.json"
# The StackArmor page and its memo examples bundle need stackarmor_vdr like the pain bundle, and are left out of depends_on and
# of the ci record for the same reason (a private repository; the demo record installs it and seeds these bundles).
stackarmor_examples = "grift/stackarmor-examples.grift.json"
stackarmor_page = "grift/stackarmor-page.grift.json"
# The finding walk-through page needs stackarmor_vdr v0.5.0 (the stackarmor-finding Search and the stackarmor_finding panel type), so like the StackArmor page it is left out of depends_on and the ci record.
stackarmor_finding_page = "grift/stackarmor-finding-page.grift.json"
# The VDR Implementations navigation section nests the stackarmor page, so it is seeded after it and only where it is.
vdr_implementations = "grift/vdr-implementations.grift.json"
# The VDR max page needs only fedramp_20x_vdr (a declared dependency), so the ci record seeds it.
vdr_max_page = "grift/vdr-max-page.grift.json"
# Nests the VDR MAX page under the VDR Implementations page: demo only, because that page is not seeded in ci.
vdr_max_nav = "grift/vdr-max-nav.grift.json"

# In-package boot records (req-boot-bootstrap-records-in-package). Digests are the canonical sha256 of
# each record; refresh with the core tooling, never hand-edit.
[[boot.records]]
name = "demo"
description = "The stack shown on screen: the composed plugin set, each pinned by commit, plus this plugin's seed bundles."
sha256 = "fe431a2ff2c21e752fce6e1591f75ebc6cc267350cdde69ae543eebfe6830c36"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in, offline and credential-free. The consumer flips self to editable."
sha256 = "0fa38135ed5a1288c3ddbfaa610d71bd00ffdc765fa1296a86c8d8f90426a668"
